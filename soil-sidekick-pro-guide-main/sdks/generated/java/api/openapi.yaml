  name: Soil Analysis
- description: County and location-based endpoints
  name: Geographic
- description: Water quality assessment
  name: Water Quality
- description: Environmental impact and analytics
  name: Environmental
- description: Satellite imagery and analysis
  name: Satellite Data
- description: AI-powered agricultural intelligence
  name: AI Services
- description: Variable rate technology and prescription maps
  name: VRT
- description: Carbon credit calculation and tracking
  name: Carbon
- description: LeafEngines plant compatibility API
  name: LeafEngines
- description: "Consumer-focused plant identification, care, and guidance APIs designed\
    \ to solve common pain points in plant ID apps"
  name: Consumer Plant Care
paths:
  /get-soil-data:
    post:
      description: Retrieve comprehensive soil analysis for a specific county
      operationId: getSoilData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getSoilData_request'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoilData'
          description: Successful response
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per window
              explode: false
              schema:
                type: integer
              style: simple
            X-RateLimit-Remaining:
              description: Remaining requests in window
              explode: false
              schema:
                type: integer
              style: simple
            X-RateLimit-Reset:
              description: Unix timestamp when limit resets
              explode: false
              schema:
                type: integer
              style: simple
            X-Response-Time:
              description: "Human-readable response time (e.g., \"245ms\")"
              example: 245ms
              explode: false
              schema:
                type: string
              style: simple
            X-Response-Time-Ms:
              description: Response time in milliseconds
              example: 245
              explode: false
              schema:
                type: integer
              style: simple
            X-Response-Time-Target:
              description: Target response time for this endpoint
              example: 500ms
              explode: false
              schema:
                type: string
              style: simple
            X-Response-Time-Status:
              description: Performance status relative to SLA targets
              explode: false
              schema:
                enum:
                - optimal
                - acceptable
                - exceeded
                type: string
              style: simple
        "401":
          content:
            application/json:
              example:
                error: Authentication required
                message: Invalid or missing API key
                code: UNAUTHORIZED
              schema:
                $ref: '#/components/schemas/Error'
          description: Authentication required or invalid API key
        "403":
          content:
            application/json:
              example:
                error: Tier restriction
                message: This feature requires Pro tier or higher
                code: TIER_RESTRICTED
              schema:
                $ref: '#/components/schemas/Error'
          description: Tier restriction - upgrade required
        "429":
          content:
            application/json:
              example:
                error: Rate limit exceeded
                message: You have exceeded your rate limit. Retry after reset time.
                code: RATE_LIMITED
              schema:
                $ref: '#/components/schemas/Error'
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:
              explode: false
              schema:
                type: integer
              style: simple
            X-RateLimit-Remaining:
              explode: false
              schema:
                type: integer
              style: simple
            X-RateLimit-Reset:
              explode: false
              schema:
                type: integer
              style: simple
            X-Response-Time:
              description: Response time even for rate-limited requests
              explode: false
              schema:
                type: string
              style: simple
        "500":
          content:
            application/json:
              example:
                error: Internal server error
                message: An unexpected error occurred
                code: INTERNAL_ERROR
              schema:
                $ref: '#/components/schemas/Error'
          description: Internal server error
          headers:
            X-Response-Time:
              description: Response time for error responses
              explode: false
              schema:
                type: string
              style: simple
      summary: Get soil analysis data
      tags:
      - Soil Analysis
      x-tier-required: free
      x-content-type: application/json
      x-accepts: application/json
