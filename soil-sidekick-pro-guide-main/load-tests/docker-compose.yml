version: '3.8'

services:
  # InfluxDB for storing test metrics
  influxdb:
    image: influxdb:2.7
    container_name: k6-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=k6
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
  
  # Grafana for visualizing test results
  grafana:
    image: grafana/grafana:latest
    container_name: k6-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - influxdb
  
  # k6 load test runner
  k6:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k6-runner
    environment:
      - CLOUD_API_URL=${CLOUD_API_URL:-http://host.docker.internal:3001}
      - EDGE_API_URL=${EDGE_API_URL:-http://host.docker.internal:3002}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-http://host.docker.internal:1883}
      - API_KEY=${API_KEY:-test-key}
      - EDGE_API_KEY=${EDGE_API_KEY:-edge-test-key}
      - TEST_TYPE=${TEST_TYPE:-smoke}
      - INFLUXDB_URL=http://influxdb:8086/k6
    volumes:
      - ./scripts:/app/scripts
      - ./test-results:/results
      - ./fixtures:/app/fixtures
    depends_on:
      - influxdb
    command: run-load-test

  # Mock API server for testing (optional)
  mock-api:
    image: mockserver/mockserver:latest
    container_name: mock-api-server
    ports:
      - "3001:1080"
    command: -serverPort 1080 -logLevel INFO
    
  # Mock Edge API server (optional)
  mock-edge-api:
    image: mockserver/mockserver:latest
    container_name: mock-edge-api-server
    ports:
      - "3002:1080"
    command: -serverPort 1080 -logLevel INFO
    
  # MQTT broker for testing (optional)
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    ports:
      - "1883:1883"  # MQTT
      - "9001:9001"  # WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

volumes:
  influxdb-data:
  grafana-data: