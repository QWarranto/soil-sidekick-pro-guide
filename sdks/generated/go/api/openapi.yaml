              explode: false
              schema:
                type: integer
              style: simple
            X-RateLimit-Reset:
              description: Unix timestamp when limit resets
              explode: false
              schema:
                type: integer
              style: simple
            X-Response-Time:
              description: "Human-readable response time (e.g., \"245ms\")"
              example: 245ms
              explode: false
              schema:
                type: string
              style: simple
            X-Response-Time-Ms:
              description: Response time in milliseconds
              example: 245
              explode: false
              schema:
                type: integer
              style: simple
            X-Response-Time-Target:
              description: Target response time for this endpoint
              example: 500ms
              explode: false
              schema:
                type: string
              style: simple
            X-Response-Time-Status:
              description: Performance status relative to SLA targets
              explode: false
              schema:
                enum:
                - optimal
                - acceptable
                - exceeded
                type: string
              style: simple
        "401":
          content:
            application/json:
              example:
                error: Authentication required
                message: Invalid or missing API key
                code: UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/Error"
          description: Authentication required or invalid API key
        "403":
          content:
            application/json:
              example:
                error: Tier restriction
                message: This feature requires Pro tier or higher
                code: TIER_RESTRICTED
              schema:
                $ref: "#/components/schemas/Error"
          description: Tier restriction - upgrade required
        "429":
          content:
            application/json:
              example:
                error: Rate limit exceeded
                message: You have exceeded your rate limit. Retry after reset time.
                code: RATE_LIMITED
              schema:
                $ref: "#/components/schemas/Error"
          description: Rate limit exceeded
          headers:
            X-RateLimit-Limit:
              explode: false
              schema:
                type: integer
              style: simple
            X-RateLimit-Remaining:
              explode: false
              schema:
                type: integer
              style: simple
            X-RateLimit-Reset:
              explode: false
              schema:
                type: integer
              style: simple
            X-Response-Time:
              description: Response time even for rate-limited requests
              explode: false
              schema:
                type: string
              style: simple
        "500":
          content:
            application/json:
              example:
                error: Internal server error
                message: An unexpected error occurred
                code: INTERNAL_ERROR
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal server error
          headers:
            X-Response-Time:
              description: Response time for error responses
              explode: false
              schema:
                type: string
              style: simple
      summary: Get soil analysis data
      tags:
      - Soil Analysis
      x-tier-required: free
