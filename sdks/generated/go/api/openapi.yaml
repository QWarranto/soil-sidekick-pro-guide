paths:
  /turbo-quant-capabilities:
    post:
      description: |
        Returns hardware-specific model recommendations and estimated performance
        based on detected device capabilities. Use this to determine the optimal
        local inference configuration for the end-user's device.

        **Tier requirement:** Pro or Enterprise
      operationId: turboQuantCapabilities
      parameters:
      - description: |
          TurboQuant extended context window size (tokens).
          With 3-bit KV cache, context windows up to 24K tokens are feasible
          within the same memory budget as standard 4K.
        explode: false
        in: header
        name: x-tq-context-mode
        required: false
        schema:
          default: 4096
          enum:
          - 4096
          - 8192
          - 16384
          - 24576
          type: integer
        style: simple
      - description: |
          KV cache management hint.
          - `none`: No caching (default)
          - `reuse`: Reuse KV cache from previous request in same session (40-60% compute savings)
          - `persist`: Persist cache to disk for cross-session reuse
        explode: false
        in: header
        name: x-tq-kv-cache-hint
        required: false
        schema:
          default: none
          enum:
          - none
          - reuse
          - persist
          type: string
        style: simple
      - description: |
          Preferred model tier for inference.
          - `auto`: Server selects optimal model based on device capabilities
          - `gemma-2b`: Lightweight model (~0.5GB KV with TQ)
          - `gemma-7b`: Full model, standard KV cache
          - `gemma-7b-tq`: Full model with TurboQuant 3-bit KV cache (~1.3GB)
        explode: false
        in: header
        name: x-tq-model-tier
        required: false
        schema:
          default: auto
          enum:
          - auto
          - gemma-2b
          - gemma-7b
          - gemma-7b-tq
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/turboQuantCapabilities_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurboQuantCapabilities"
          description: TurboQuant capability assessment
        "401":
          content:
            application/json:
              example:
                error: Authentication required
                message: Invalid or missing API key
                code: UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/Error"
          description: Authentication required or invalid API key
        "403":
          content:
            application/json:
              example:
                error: Tier restriction
                message: This feature requires Pro tier or higher
                code: TIER_RESTRICTED
              schema:
                $ref: "#/components/schemas/Error"
          description: Tier restriction - upgrade required
      summary: Query TurboQuant device capabilities
      tags:
      - TurboQuant
      x-tier-required: pro
